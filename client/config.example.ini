; 极限词本机客户端本地配置（账号密码记在这里；退出登录会清空密码与 token）
; 窗口显示名见 client/version.py APP_TITLE = 小李的电商扫描器

[cloud]
; 云端 API 根地址
server = https://leedreamer.cn/absolute_term/api
; 云端用户名（登录成功后写入）
username =
; 云端密码（登录成功后写入；退出登录清空）
password =
; 登录会话 token（自动登录用；退出登录清空）
token =

[fetch]
; 每个商品间隔秒数
item_delay_seconds = 2.0
; 连续风控多少次后暂停
wind_control_pause_after = 3
; 风控暂停秒数
wind_control_pause_seconds = 45.0
; 打开淘宝的默认地址
taobao_login_url = https://www.taobao.com/
; mtop 失败后用 Chrome 抓取时，等人过滑块的最长秒数
chrome_slider_wait_seconds = 180
; 抓取条数上限，0=全部
fetch_limit = 0
; 分析条数上限，0=全部
analyze_limit = 0

[output]
; 空=按当前登录用户用 程序目录/file/<用户名>/output ；手选绝对路径才会写死
dir =
; 空=程序目录/file/<用户名>/shops 。不要填 AppData
shops_dir =

[layout]
; 布局版本：抬升会重置主窗柱子（v4 起上栏默认更高，避免日志地包天）
layout_version = 4
; 主窗几何 WxH+X+Y（拖动/改大小后自动写回）
main_geometry = 1100x720
; 主窗左右分栏柱子像素（左栏操作区，最小约 360）
main_sash = 560
; 左侧上下分栏：上=链接/Cookie/词表，下=日志。默认偏上（约 480），最小 360
left_sash = 480
; Cookie 文本框行高（可拖底边改高并写回）
cookie_height = 3
; 词表文本框基准行高（上栏变高时仍可再撑开）
words_height = 8
; 兼容旧 ini；现行日志高度由下栏柱子分配
log_height = 8
; 看源文件窗几何与左右柱子
md_geometry = 900x600
md_sash = 240
; 问题商品窗 / 设置窗 / 登录窗几何
problems_geometry = 820x520
settings_geometry = 480x260
login_geometry = 360x200
