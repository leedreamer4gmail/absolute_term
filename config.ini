; absolute_term 广告极限词扫描配置
; 密钥类请写 config.ini.local（勿提交 Git）

[ui]
; 公众版不挂公司后台；此字段仅兼容旧接口
houtai_url =
; 公众版不挂公司主页；此字段仅兼容旧接口
home_url =
; 对外站点路径前缀（nginx location），公众入口
public_base = /absolute_term
; 客户端主界面 Logo（相对仓库根目录；网页用 www/img 同名文件）
logo_file = file/img/logo.jpg
; 客户端窗口图标 / 网页 favicon（小图，相对仓库根目录）
logo_icon_file = file/img/logox.jpg
; 客户端「用户名 · 余额」点击打开的充值页（须含 #recharge，打开本站充值弹窗）
recharge_url = https://leedreamer.cn/absolute_term/#recharge
; 客户端「如何获取 Cookie」打开的使用说明页（须含 #guide）
cookie_guide_url = https://leedreamer.cn/absolute_term/guide.html
; 客户端菜单「注册」打开的网页（须能切到注册页，如 ?tab=register）
register_url = https://leedreamer.cn/absolute_term/?tab=register
; 管理员 leedreamer 顶栏「数据库」新开页（只读浏览表数据）
db_admin_url = https://leedreamer.cn/absolute_term/db.html

[db]
; PostgreSQL 主机
host = 127.0.0.1
; PostgreSQL 端口
port = 5432
; 数据库名
name = absolute_term_db
; 数据库用户（密码放 config.ini.local）
user = leedreamer
; 数据库密码（务必在 config.ini.local 覆盖）
password =
; 用户密码哈希盐（务必在 config.ini.local 设置固定值，改盐会使旧密码失效）
password_salt =

[auth]
; 网页登录会话有效秒数（仅 web；客户端 token 不过期，只在退出登录/改密时作废）
session_ttl_seconds = 604800
; 可选：启动时若两者都非空，则确保该测试用户存在（密码只应写在服务器 config.ini.local 覆盖）
; 开源仓库留空，禁止把真实口令提交进 Git
bootstrap_username =
bootstrap_password =
; 短信验证码有效秒数
sms_ttl_seconds = 300
; 同一手机同一用途最短重发间隔秒数
sms_resend_seconds = 60
; 短信验证码位数（阿里云模板 ${code}）
sms_code_length = 6
; 客户端点用户名打开网页时，一次性登录票有效秒数（用完即废，不把密码放进 URL）
web_ticket_ttl_seconds = 120
; 管理员 user_tb.id（唯一管理员锚点；网页「管理」下拉、设置/数据库/LLM提示词、/admin/* 接口都只认这个 id）
; 留空=没有任何管理员。生产环境在服务器 config.ini / local 里填写，勿把真实 id 策略当秘密，但开源模板默认留空
admin_user_id =

[geo]
; 是否记录登录 IP 归属城市：1=是，0=否（关闭后只记 IP，不查城市）
enabled = 1
; IP 归属地查询接口，{ip} 会被替换为登录 IP。ip-api.com 免费版仅支持 http、每分钟 45 次
api_url = http://ip-api.com/json/{ip}?lang=zh-CN&fields=status,country,regionName,city
; 从接口返回 JSON 里按顺序取哪个字段当「城市」，逗号分隔，取第一个非空值（city=市，regionName=省，市查不到退回省）
city_json_keys = city,regionName
; 归属地查询超时秒数。超时或失败只把城市留空，不影响登录
timeout_seconds = 3

[pay]
; 充值总开关：1=开放微信/支付宝充值，0=关闭（后台「设置」可改）
enabled = 1
; 商户密钥（mch_id/app_id/私钥路径/证书等）只写服务器 config.ini.local 的 [wxpay]/[zfbpay]，勿提交

[client]
; 本机客户端默认上传 API（可在客户端设置面板改）
default_api = https://leedreamer.cn/absolute_term/api
; 本机抓取基础间隔秒数（无挤爆时用）
item_delay_seconds = 2.5
; 自适应间隔下限（秒）
item_delay_min_seconds = 2.0
; 自适应间隔上限（秒）；挤爆频繁时逐步抬到此值
item_delay_max_seconds = 25.0
; 每次挤爆后当前间隔乘以此系数（随后无风控会缓慢回落）
wind_backoff_factor = 1.8
; 连续风控多少次后额外长暂停
wind_control_pause_after = 2
; 风控长暂停秒数
wind_control_pause_seconds = 60.0
; 打开本机浏览器登录淘宝的默认地址
taobao_login_url = https://www.taobao.com/
; 是否尝试自动拖滑块：1=是，0=否
auto_slider = 1
; 开始抓取时若未登录，等待用户在专用 Chrome 登录的最长秒数
chrome_login_wait_seconds = 180
; 自动采链：专用 Chrome 先打开此页，从 DOM/网络抽商品 id（须已登录淘宝）
link_harvest_url = https://www.taobao.com/
; 首页抽不够时改走搜索页；必须含 {q}，会被 link_harvest_keyword 替换
link_harvest_search_url = https://s.taobao.com/search?q={q}
; 搜索兜底关键词（逗号分隔则每次采链随机抽一个）
link_harvest_keyword = 日用
; 一次采链目标：入队多少个「未扫过店铺」的商品链接
link_harvest_count = 5
; 采链最多尝试多少个商品 id（含已扫跳过/解析失败）；必须 ≥ count
link_harvest_max_try = 40
; 每个采链页等待渲染/滚动的秒数
link_harvest_wait_seconds = 8
; 自动随机扫最多扫多少家店，0=直到点「停止」
auto_random_max_shops = 0
; 两家店之间额外等待秒数（不含店内商品间隔）
auto_random_pause_seconds = 8
; 自动随机扫时是否每店弹出问题商品窗：1=弹，0=只写日志（可在已扫店铺里点开）
auto_random_popup_problems = 0

[llm]
; SiliconFlow DeepSeek Flash（客户端每次向云端拉取，不落盘）
; API 地址
api_url = https://api.siliconflow.cn/v1/chat/completions
; 模型：DeepSeek-V4-Flash
model = deepseek-ai/DeepSeek-V4-Flash
; API Key 必须写在服务器 config.ini.local 的 [llm] api_key（勿提交 Git）
api_key =
; LLM 二次判定提示词（占位符：{title} {url} {hits_block} {rules}；仅管理员 leedreamer 网页可改）
judge_prompt = 你是电商广告合规审核员。下面商品文本命中了极限词或错误描述候选, 请判断哪些构成《广告法》绝对化用语违规或虚假宣传, 哪些是正常表述。
	判定原则：
	1. 只有宣称本品优于一切/无人能及/行业第一等「绝对化推销」才算违规，例如：最好、第一、天花板、最便宜、独一无二（吹效果）。
	2. 单字「最/第」等出现在客观规格、数量、顺序、时间里不算违规。例如：包装最小规格、最小起订量、最大承重、最新生产日期、最多可优惠40元、最后一件库存、最初配方、最高立减。
	3. 对每条命中都必须输出一条 violations，violate 填 true 或 false，并写简短 reason。
	
	商品标题: {title}
	链接: {url}
	
	{hits_block}
	{rules}
	只输出一个 JSON 对象，不要 markdown，不要解释。格式: {"violations":[{"keyword":"...","source":"...","violate":true,"reason":"..."}]}

[words]
; 极限词文件（广告法绝对化用语），空格/换行分隔
limit_file = file/absolute_words.md
; 错误描述文件（产品实际没有却出现的虚假词）
wrong_file = file/wrong_word.md

[scan]
; 商品标题数据文件（CSV: id,title）
items_file = data/items.csv
; 扫描结果输出文件
output_file = output/违规清单.txt
; 扫描资料缓存（标题/主图OCR/详情文字），避免重复抓取
goods_file = file/goods.md
; 旧版店铺 JSON（仅迁移；正式以 shop_tb 为准）
shops_file = file/shops.json
; 默认商品上限，0 = 不限制（扫到多少写多少）
default_max_items = 0
; 服务器重新扫描时每个商品间隔秒数（防淘宝「被挤爆」）
item_delay_seconds = 1.8
; 连续风控多少次后暂停加长等待
wind_control_pause_after = 3
; 风控暂停秒数
wind_control_pause_seconds = 45

[image]
; 需要抽查主图的商品数量上限
sample_count = 20
; 图片下载目录
image_dir = images
; 主图 OCR 张数上限
main_ocr_count = 2
; 详情图 OCR 张数上限
detail_ocr_count = 6

[ocr]
; OCR 引擎：rapidocr（默认）
engine = rapidocr
; 识别置信度阈值
confidence = 0.5
; 本地 OCR 服务地址
ocr_base = http://127.0.0.1:8799

[client_release]
; 客户端对外版本号（须与安装包/Inno MyAppVersion、client/version.py 同号抬）
client_app_version = 1.6.1
; 完整安装包下载 URL（单文件 Setup.exe）
download_main_url = https://leedreamer.cn/absolute_term/downloads/absolute_term_Setup.exe
download_main_label = 小李的电商扫描器
download_main_note = Windows 安装程序 Setup.exe（非源码）
; 升级包（客户端「检查更新」；可与完整包同文件）
download_update_url = https://leedreamer.cn/absolute_term/downloads/absolute_term_update_Setup.exe
download_update_note = 升级安装程序

[billing]
; 每扫描 1 条商品扣费（元），0=免费。管理员后台「扫商品单价」可改
scan_fee_yuan = 0
; 永久打开客户端「自动模式」的一次性费用（元），0=免费开通。管理员后台「自动扫描费用」可改
auto_scan_fee_yuan = 99

[aliyun_sms]
; 是否启用阿里云短信：1=是，0=否。未启用时发验证码会明确报错，不假装发出
enabled = 1
; 短信签名（可在网页设置改；须与阿里云控制台一致）
sign_name =
; 短信模板 CODE，模板内容须含 ${code}（可在网页设置改）
template_code =
; access_key_id / access_key_secret 禁止写本文件，必须放 config.ini.local [aliyun_sms]

